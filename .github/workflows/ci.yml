name: CI

# push: only master (after merge). pull_request: PRs targeting master.
# Avoid listing feature branches under push — each PR push would run CI twice (push + pull_request).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test and build hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Fetch bundled CFR
        run: bun run setup:cfr

      - name: Test
        run: bun test

      - name: Validate MCP server.json version
        run: bun run validate:server-json

      - name: Prepack (typecheck, build, validate resources)
        run: bun run prepack

      - name: Verify publish manifest on disk
        run: bun run verify:publish

      - name: Smoke test CLI on Node 20 (minimum supported runtime)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - run: node dist/cli.js --version

      - name: Smoke test CLI on Node 24 (CI / latest)
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: node dist/cli.js --version
