name: Release Please

# Conventional commits on `develop` → Release PR to `master` → merge → tag + npm publish.
on:
  push:
    branches:
      - develop
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Version and changelog
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: google-github-actions/release-please@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify tag matches package.json version
        run: bun run verify:release-tag
        env:
          GITHUB_REF_NAME: ${{ needs.release-please.outputs.tag_name }}

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Fetch bundled CFR
        run: bun run setup:cfr

      - name: Test
        run: bun test

      - name: Build publishable package
        run: bun run prepack

      - name: Verify publish manifest
        run: bun run verify:publish

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
