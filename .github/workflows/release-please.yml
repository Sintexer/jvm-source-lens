name: release-please

# master push → open/update Release PR on master (conventional commits on master)
# Merging that Release PR → tag + npm publish (release_created)
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.release.outputs.release_created }}
        with:
          bun-version: "1.3.14"

      # Trusted publishing (npm): OIDC via id-token — do not set NODE_AUTH_TOKEN here.
      # npmjs.com → jvmsrc → Settings → Trusted publishing → GitHub Actions (this repo + workflow).
      - uses: actions/setup-node@v5
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm (trusted publishing requires npm ≥ 11.5.1)
        if: ${{ steps.release.outputs.release_created }}
        run: npm install -g npm@11 && npm --version

      - run: bun install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}

      - run: bun run setup:cfr
        if: ${{ steps.release.outputs.release_created }}

      - run: npm publish --provenance --access public
        if: ${{ steps.release.outputs.release_created }}
