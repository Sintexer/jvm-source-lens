name: Feature request
description: Suggest a tool, a build system or a behavior change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What did your agent get wrong or fail to do? Give a real example.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [New tool, Build system (sbt, Bazel), Decompiler, Docs, Other]
