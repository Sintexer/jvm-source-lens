name: Bug report
description: jvmsrc gave a wrong, empty or failed result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the tool or command, the arguments, and the error `code` if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: jvmsrc version
      placeholder: "1.21.0 (run `jvmsrc --version`)"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build tool
      options: [Gradle, Maven]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Build tool, Java and Node versions
      placeholder: "Gradle 8.14, JDK 21, Node 22"
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Code 2.1, Cursor, CLI only"
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics
      description: Output of `jvmsrc diagnostics` for the failure, if any. Remove private paths and names.
      render: text
