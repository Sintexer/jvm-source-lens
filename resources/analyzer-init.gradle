import groovy.json.JsonBuilder
import java.time.Instant
import org.gradle.api.artifacts.Configuration
import org.gradle.api.artifacts.ResolvedArtifact
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import org.gradle.api.artifacts.result.ResolvedComponentResult
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.jvm.JvmLibrary
import org.gradle.language.base.artifact.SourcesArtifact

gradle.projectsLoaded { g ->
    g.rootProject.tasks.register("jvmsrcResolve") {
        group = "jvmsrc"
        description = "Emit full resolution JSON (README §5.5.2 schema)."
        doLast {
            def root = project
            def errors = []
            def projectRoot = root.rootDir.absolutePath
            def wrapperProp = root.gradle.startParameter.projectProperties.get("jvmsrcWrapper")
            def wrapper = wrapperProp != null && "true".equalsIgnoreCase(String.valueOf(wrapperProp))

            def configSpecs = [
                [name: "compileClasspath", scope: "compile"],
                [name: "runtimeClasspath", scope: "runtime"],
                [name: "testCompileClasspath", scope: "test-compile"],
                [name: "testRuntimeClasspath", scope: "test-runtime"],
                [name: "jvmCompileClasspath", scope: "compile"],
                [name: "jvmRuntimeClasspath", scope: "runtime"],
                [name: "jvmTestCompileClasspath", scope: "test-compile"],
                [name: "jvmTestRuntimeClasspath", scope: "test-runtime"],
            ]

            def modules = []
            root.allprojects { org.gradle.api.Project project ->
                def configurationsOut = []
                configSpecs.each { spec ->
                    def cfgName = spec.name
                    def cfg = project.configurations.findByName(cfgName)
                    if (cfg == null) {
                        return
                    }
                    try {
                        def otherBuildDirs = root.allprojects.findAll { it != project }.collect { it.buildDir.absolutePath }
                        def artifacts = collectArtifacts(project, cfg as Configuration, otherBuildDirs)
                        configurationsOut << [
                            name        : cfgName,
                            scope       : spec.scope,
                            artifacts   : artifacts,
                        ]
                    } catch (Exception e) {
                        errors << [
                            module         : (project.path == ":" ? "root" : project.path),
                            configuration  : cfgName,
                            message        : e.message ?: e.class.name,
                            fatal          : false,
                        ]
                    }
                }
                modules << [
                    name            : (project.path == ":" ? "root" : project.path),
                    path            : project.projectDir.absolutePath,
                    configurations: configurationsOut,
                ]
            }

            def result = [
                schemaVersion: "1.1",
                resolvedAt   : Instant.now().toString(),
                buildSystem  : [
                    type   : "gradle",
                    version: root.gradle.gradleVersion,
                    wrapper: wrapper,
                ],
                projectRoot: projectRoot,
                modules    : modules,
                errors     : errors,
            ]
            println new JsonBuilder(result).toPrettyString()
        }
    }

    g.rootProject.tasks.register("jvmsrcResolveSources") {
        group = "jvmsrc"
        description = "Resolve sources JAR for one external module (on-demand for jvmsrc get)."
        doLast {
            def root = project
            def props = root.gradle.startParameter.projectProperties
            def group = props.get("jvmsrcGroup")
            def name = props.get("jvmsrcName")
            def version = props.get("jvmsrcVersion")
            if (group == null || name == null || version == null) {
                throw new org.gradle.api.GradleException(
                    "jvmsrcResolveSources requires -PjvmsrcGroup, -PjvmsrcName, -PjvmsrcVersion")
            }

            def sourcesPath = null
            try {
                def result = root.dependencies.createArtifactResolutionQuery()
                    .forModule(group.toString(), name.toString(), version.toString())
                    .withArtifacts(JvmLibrary, SourcesArtifact)
                    .execute()
                result.resolvedComponents.each { component ->
                    component.getArtifacts(SourcesArtifact).each { artifact ->
                        if (artifact instanceof ResolvedArtifactResult) {
                            sourcesPath = artifact.file.absolutePath
                        }
                    }
                }
            } catch (Exception ignored) {
                // Module has no published sources variant.
            }
            println new JsonBuilder([sourcesJarPath: sourcesPath]).toString()
        }
    }
}

@SuppressWarnings("GrMethodMayBeStatic")
List<Map<String, Object>> collectArtifacts(org.gradle.api.Project project, Configuration config, List<String> otherBuildDirs) {
    def rr = config.incoming.resolutionResult
    def root = rr.root

    def directSelected = new HashSet<ResolvedComponentResult>()
    root.dependencies.each { dep ->
        if (dep instanceof ResolvedDependencyResult && dep.from == root) {
            directSelected.add(dep.selected)
        }
    }

    def moduleKeyToComponent = [:] as Map<String, ResolvedComponentResult>
    rr.allComponents.each { ResolvedComponentResult comp ->
        if (comp.id instanceof ModuleComponentIdentifier) {
            def m = (ModuleComponentIdentifier) comp.id
            moduleKeyToComponent[moduleKeyFromId(m)] = comp
        }
    }

    def list = []

    rr.allComponents.each { ResolvedComponentResult comp ->
        if (comp == root) {
            return
        }
        def id = comp.id
        if (!(id instanceof ProjectComponentIdentifier)) {
            return
        }
        def pci = (ProjectComponentIdentifier) id
        def direct = directSelected.contains(comp)
        def other = project.rootProject.findProject(pci.projectPath.toString())
        def group = other != null ? String.valueOf(other.group) : ""
        def name = other != null ? other.name : pci.projectPath.toString()
        def modulePath = other != null ? other.projectDir.absolutePath : pci.projectPath.toString()
        list << [
            group           : group,
            name            : name,
            version         : null,
            type            : "project",
            origin          : "interproject",
            direct          : direct,
            interproject    : [
                moduleName: pci.projectPath.toString(),
                modulePath: modulePath,
            ],
        ]
    }

    def byKey = [:].withDefault { [main: null, sources: null, mvi: null] }
    config.resolvedConfiguration.resolvedArtifacts.each { ResolvedArtifact ra ->
        def f = ra.file
        if (f == null) {
            return
        }
        if (otherBuildDirs.any { f.absolutePath.startsWith(it) }) {
            return
        }
        def mvi = ra.moduleVersion.id
        def key = "${mvi.group}:${mvi.name}:${mvi.version}"
        def entry = byKey[key]
        entry.mvi = mvi
        def classifier = ra.classifier ?: ""
        if ("sources".equals(classifier) || f.name.endsWith("-sources.jar")) {
            entry.sources = f
        } else if (!f.name.endsWith("-javadoc.jar")) {
            if (entry.main == null || classifier.isEmpty()) {
                entry.main = f
            }
        }
    }

    byKey.each { key, entry ->
        if (entry.mvi == null) {
            return
        }
        def mvi = entry.mvi
        def comp = moduleKeyToComponent[moduleKeyFromMvi(mvi)]
        boolean direct = comp != null && directSelected.contains(comp)
        def row = [
            group          : mvi.group,
            name           : mvi.name,
            version        : mvi.version,
            type           : "jar",
            jarPath        : entry.main != null ? entry.main.absolutePath : null,
            origin         : "external",
            direct         : direct,
        ]
        if (entry.sources != null) {
            row.sourcesJarPath = entry.sources.absolutePath
        }
        list << row
    }

    def emittedJarPaths = new HashSet<String>()
    list.each { Map item ->
        def jp = item.get("jarPath")
        if (jp instanceof String && jp.toString().length() > 0) {
            emittedJarPaths.add(jp.toString())
        }
    }

    config.resolvedConfiguration.resolvedArtifacts.each { ResolvedArtifact ra ->
        def f = ra.file
        if (f == null) {
            return
        }
        def ap = f.absolutePath
        if (otherBuildDirs.any { ap.startsWith(it) }) {
            return
        }
        def fn = f.name
        if (fn.endsWith("-sources.jar") || fn.endsWith("-javadoc.jar")) {
            return
        }
        if (!fn.toLowerCase().endsWith(".jar")) {
            return
        }
        if (emittedJarPaths.contains(ap)) {
            return
        }
        def mvi = ra.moduleVersion.id
        def g = mvi.group != null ? String.valueOf(mvi.group).trim() : ""
        def n = mvi.name != null ? String.valueOf(mvi.name) : fn
        def verRaw = mvi.version != null ? String.valueOf(mvi.version).trim() : ""
        def verStr = (verRaw.length() > 0 && !"unspecified".equalsIgnoreCase(verRaw)) ? verRaw : null
        def gOut = g.length() > 0 ? g : "_local"
        list << [
            group   : gOut,
            name    : n,
            version : verStr,
            type    : "local-file",
            jarPath : ap,
            origin  : "local-file",
            direct  : true,
        ]
        emittedJarPaths.add(ap)
    }

    return list
}

@SuppressWarnings("GrMethodMayBeStatic")
String moduleKeyFromId(ModuleComponentIdentifier m) {
    return "${m.group}:${m.module}:${m.version}"
}

@SuppressWarnings("GrMethodMayBeStatic")
String moduleKeyFromMvi(def mvi) {
    return "${mvi.group}:${mvi.name}:${mvi.version}"
}
