plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.example'
// version is passed via -Pversion=X on the command line by the test

java {
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri(System.getenv('JVMSRC_LOCAL_MAVEN_REPO') ?: layout.buildDirectory.dir('local-repo').get().asFile)
        }
    }
}
