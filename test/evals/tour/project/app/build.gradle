plugins {
    id 'java'
}

repositories {
    maven { url 'file://@TOUR_REPO@' }
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    implementation project(':domain')

    implementation 'acme:ledger:1.0.0'
    implementation 'acme:reports:1.2.0'
    implementation 'acme:geo:1.0.0'

    implementation 'acme:flags:3.1.0'
    implementation 'acme:ratelimit:0.9.4'
    implementation 'acme:tax:1.0.0'
    implementation 'com.github.f4b6a3:uuid-creator:6.0.0'
    implementation 'org.jctools:jctools-core:4.0.5'
    implementation name: 'acme-pricing'
}
